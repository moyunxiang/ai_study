<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 428" role="img" aria-labelledby="vit-patches-title">
<title id="vit-patches-title">ViT：把一张图变成一串token</title>
<defs><marker id="vit-patches-ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="f-ink"/></marker></defs>
<text x="12" y="17" class="t-s"><tspan class="t-b t-a">①</tspan> 把图切成固定大小的小块（这里示意画成 3×3）</text>
<rect class="box" x="20" y="26" width="96" height="96" rx="2"/>
<circle class="f-a" cx="94" cy="46" r="9"/>
<path class="f-c" d="M22 120L56 72L80 98L96 80L114 120Z" fill-opacity=".8"/>
<path class="ln2" d="M52 26V122M84 26V122M20 58H116M20 90H116"/>
<g>
<text x="136" y="44" class="t-s">实际：224×224 的图，块边长 P=16</text>
<text x="136" y="64" class="t-s">每边 224/16 = 14 块，共 196 块</text>
<text x="136" y="84" class="t-s">每块有 16×16×3 = 768 个数</text>
<text x="136" y="104" class="t-s t-mu">（ViT-B/16 的设置）</text>
</g>
<text x="12" y="144" class="t-s"><tspan class="t-b t-a">②</tspan> 从左到右、从上到下排成一串，每块展平成一个长向量</text>
<g>
<rect class="box" x="86" y="152" width="27" height="26" rx="3"/><rect class="box" x="121" y="152" width="27" height="26" rx="3"/><rect class="box" x="156" y="152" width="27" height="26" rx="3"/><rect class="box" x="191" y="152" width="27" height="26" rx="3"/><rect class="box" x="226" y="152" width="27" height="26" rx="3"/><rect class="box" x="261" y="152" width="27" height="26" rx="3"/><rect class="box" x="296" y="152" width="27" height="26" rx="3"/><rect class="box" x="331" y="152" width="27" height="26" rx="3"/><rect class="box" x="366" y="152" width="27" height="26" rx="3"/>
</g>
<g text-anchor="middle">
<text x="99.5" y="170" class="t-m">1</text><text x="134.5" y="170" class="t-m">2</text><text x="169.5" y="170" class="t-m">3</text><text x="204.5" y="170" class="t-m">4</text><text x="239.5" y="170" class="t-m">5</text><text x="274.5" y="170" class="t-m">6</text><text x="309.5" y="170" class="t-m">7</text><text x="344.5" y="170" class="t-m">8</text><text x="379.5" y="170" class="t-m">9</text>
</g>
<path class="ln" d="M239.5 178V192" marker-end="url(#vit-patches-ah)"/>
<rect class="hi2" x="82" y="194" width="318" height="28" rx="6"/>
<text x="241" y="213" text-anchor="middle"><tspan class="t-b t-a">③</tspan> 每块乘同一个矩阵 <tspan class="t-m">E</tspan>，变成 <tspan class="t-m">D</tspan> 维向量</text>
<path class="ln" d="M239.5 222V236" marker-end="url(#vit-patches-ah)"/>
<text x="20" y="256" class="t-m t-a t-b">[CLS]</text>
<rect class="hi" x="60" y="238" width="12" height="26" rx="2"/>
<g>
<rect class="hi2" x="93.5" y="238" width="12" height="26" rx="2"/><rect class="hi2" x="128.5" y="238" width="12" height="26" rx="2"/><rect class="hi2" x="163.5" y="238" width="12" height="26" rx="2"/><rect class="hi2" x="198.5" y="238" width="12" height="26" rx="2"/><rect class="hi2" x="233.5" y="238" width="12" height="26" rx="2"/><rect class="hi2" x="268.5" y="238" width="12" height="26" rx="2"/><rect class="hi2" x="303.5" y="238" width="12" height="26" rx="2"/><rect class="hi2" x="338.5" y="238" width="12" height="26" rx="2"/><rect class="hi2" x="373.5" y="238" width="12" height="26" rx="2"/>
</g>
<g text-anchor="middle">
<text x="66" y="282" class="t-g">+p₀</text><text x="99.5" y="282" class="t-g">+p₁</text><text x="134.5" y="282" class="t-g">+p₂</text><text x="169.5" y="282" class="t-g">+p₃</text><text x="204.5" y="282" class="t-g">+p₄</text><text x="239.5" y="282" class="t-g">+p₅</text><text x="274.5" y="282" class="t-g">+p₆</text><text x="309.5" y="282" class="t-g">+p₇</text><text x="344.5" y="282" class="t-g">+p₈</text><text x="379.5" y="282" class="t-g">+p₉</text>
</g>
<text x="12" y="304" class="t-s"><tspan class="t-b t-a">④</tspan> 最前面放一个可学习的 [CLS]；每个位置加可学习的位置编码 p</text>
<path class="ln" d="M210 313V326" marker-end="url(#vit-patches-ah)"/>
<rect class="box" x="20" y="328" width="380" height="44" rx="6"/>
<text x="210" y="347" text-anchor="middle" class="t-b"><tspan class="t-a">⑤</tspan> 标准 Transformer 编码器，堆 L 层</text>
<text x="210" y="364" text-anchor="middle" class="t-s">每层：LN → 多头自注意力 → 残差；LN → MLP → 残差</text>
<path class="ln" d="M66 372V388" marker-end="url(#vit-patches-ah)"/>
<rect class="hi" x="20" y="390" width="180" height="28" rx="6"/>
<text x="110" y="409" text-anchor="middle">[CLS] 位置的输出</text>
<path class="ln" d="M200 404H218" marker-end="url(#vit-patches-ah)"/>
<rect class="box" x="220" y="390" width="180" height="28" rx="6"/>
<text x="310" y="409" text-anchor="middle">LN + 分类头 → 类别</text>
</svg>
