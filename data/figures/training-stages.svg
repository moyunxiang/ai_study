<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 524" role="img" aria-labelledby="training-stages-title">
<title id="training-stages-title">大语言模型训练的三个阶段：预训练、监督微调、强化学习</title>
<defs><marker id="training-stages-ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="f-ink"/></marker></defs>
<text x="12" y="17" class="t-s">每个阶段：用什么数据、什么训练信号（红字）、得到什么模型</text>
<rect class="box2" x="12" y="28" width="396" height="74" rx="7"/>
<text x="24" y="48"><tspan class="t-b t-a">①</tspan> <tspan class="t-b">预训练</tspan></text>
<text x="24" y="70" class="t-s"><tspan class="t-b">数据</tspan>　海量无标注文本：网页、书籍、代码</text>
<text x="24" y="90" class="t-s"><tspan class="t-b">信号</tspan>　<tspan class="t-a">预测下一个 token（交叉熵），不需要人工标签</tspan></text>
<rect class="hi2" x="110" y="120" width="200" height="28" rx="6"/>
<text x="210" y="139" text-anchor="middle" class="t-b">基础模型：只会续写文本</text>
<rect class="box2" x="12" y="166" width="396" height="74" rx="7"/>
<text x="24" y="186"><tspan class="t-b t-a">②</tspan> <tspan class="t-b">监督微调（SFT）</tspan></text>
<text x="24" y="208" class="t-s"><tspan class="t-b">数据</tspan>　人写的“指令 → 理想回答”样本，数量少得多</text>
<text x="24" y="228" class="t-s"><tspan class="t-b">信号</tspan>　<tspan class="t-a">仍是预测下一个 token，只在回答部分算损失</tspan></text>
<rect class="hi2" x="110" y="258" width="200" height="28" rx="6"/>
<text x="210" y="277" text-anchor="middle" class="t-b">SFT 模型：会按指令回答</text>
<rect class="box2" x="12" y="304" width="396" height="164" rx="7"/>
<text x="24" y="324"><tspan class="t-b t-a">③</tspan> <tspan class="t-b">强化学习后训练（RL）</tspan></text>
<text x="24" y="346" class="t-s"><tspan class="t-b">数据</tspan>　只有提示；回答由模型自己生成</text>
<rect class="box" x="28" y="358" width="104" height="28" rx="6"/><text x="80" y="377" text-anchor="middle">生成回答</text>
<rect class="box" x="158" y="358" width="104" height="28" rx="6"/><text x="210" y="377" text-anchor="middle">打分</text>
<rect class="box" x="288" y="358" width="104" height="28" rx="6"/><text x="340" y="377" text-anchor="middle">更新模型</text>
<text x="24" y="418" class="t-s t-b">打分</text>
<text x="56" y="418" class="t-s">a. 奖励模型：用人类对回答的排序训练出来</text>
<text x="56" y="436" class="t-s">b. 可验证奖励：答案对不对、代码过不过测试</text>
<text x="24" y="456" class="t-s"><tspan class="t-b">信号</tspan>　<tspan class="t-a">高分回答的概率调高；KL 项拴住，别离 SFT 太远</tspan></text>
<rect class="hi2" x="90" y="486" width="240" height="28" rx="6"/>
<text x="210" y="505" text-anchor="middle" class="t-b">最终模型：有用的助手或推理模型</text>
<g class="ln" marker-end="url(#training-stages-ah)">
<path d="M210 102V118"/><path d="M210 148V164"/><path d="M210 240V256"/><path d="M210 286V302"/><path d="M210 468V484"/>
<path d="M132 372H156"/><path d="M262 372H286"/>
</g>
<path class="ln2 dash" d="M340 386V398H80V389" marker-end="url(#training-stages-ah)"/>
</svg>
