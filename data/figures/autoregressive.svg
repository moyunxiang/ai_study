<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 398" role="img" aria-labelledby="autoregressive-title">
<title id="autoregressive-title">自回归生成：一次预测一个token，接上再预测</title>
<defs><marker id="autoregressive-ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="f-ink"/></marker><marker id="autoregressive-ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="f-a"/></marker></defs>
<text x="12" y="17" class="t-s"><tspan class="t-b t-a">①</tspan> 生成：把已有的全部 token 输入模型，得到下一个的概率</text>
<rect class="box" x="14" y="32" width="66" height="28" rx="5"/><text x="47" y="51" text-anchor="middle">今天天气</text>
<rect class="box2" x="130" y="32" width="50" height="28" rx="5"/><text x="155" y="51" text-anchor="middle">模型</text>
<g class="ln" marker-end="url(#autoregressive-ah)"><path d="M80 46H128"/><path d="M180 46H194"/><path d="M302 46H334"/></g>
<text x="200" y="36" class="t-s">很</text><rect class="f-a" x="214" y="28" width="32" height="8" rx="1"/><text x="250" y="36" class="t-s">0.4</text>
<text x="200" y="50" class="t-s">不</text><rect class="f-mu" x="214" y="42" width="24" height="8" rx="1"/><text x="242" y="50" class="t-s">0.3</text>
<text x="200" y="64" class="t-s">真</text><rect class="f-mu" x="214" y="56" width="16" height="8" rx="1"/><text x="234" y="64" class="t-s">0.2</text>
<text x="318" y="40" text-anchor="middle" class="t-s"><tspan class="t-b t-a">②</tspan>采样</text>
<rect class="hi" x="338" y="32" width="32" height="28" rx="5"/><text x="354" y="51" text-anchor="middle" class="t-b">很</text>
<rect class="box" x="14" y="112" width="66" height="28" rx="5"/><text x="47" y="131" text-anchor="middle">今天天气</text>
<rect class="hi" x="84" y="112" width="28" height="28" rx="5"/><text x="98" y="131" text-anchor="middle" class="t-b">很</text>
<rect class="box2" x="130" y="112" width="50" height="28" rx="5"/><text x="155" y="131" text-anchor="middle">模型</text>
<g class="ln" marker-end="url(#autoregressive-ah)"><path d="M112 126H128"/><path d="M180 126H194"/><path d="M302 126H334"/></g>
<text x="200" y="116" class="t-s">好</text><rect class="f-a" x="214" y="108" width="48" height="8" rx="1"/><text x="266" y="116" class="t-s">0.6</text>
<text x="200" y="130" class="t-s">热</text><rect class="f-mu" x="214" y="122" width="16" height="8" rx="1"/><text x="234" y="130" class="t-s">0.2</text>
<text x="200" y="144" class="t-s">冷</text><rect class="f-mu" x="214" y="136" width="8" height="8" rx="1"/><text x="226" y="144" class="t-s">0.1</text>
<text x="318" y="120" text-anchor="middle" class="t-s"><tspan class="t-b t-a">②</tspan>采样</text>
<rect class="hi" x="338" y="112" width="32" height="28" rx="5"/><text x="354" y="131" text-anchor="middle" class="t-b">好</text>
<path class="ln-a" d="M354 60V92H98V110" marker-end="url(#autoregressive-ar)"/>
<text x="226" y="86" text-anchor="middle" class="t-s"><tspan class="t-b t-a">③</tspan> 接到末尾，再来一轮</text>
<text x="12" y="170" class="t-s">……一直循环到采出结束符：生成 n 个 token 要跑 n 次模型</text>
<path class="ln2" d="M12 184H408"/>
<text x="12" y="204" class="t-s"><tspan class="t-b t-a">④</tspan> 训练：整句一次输入，每个位置同时预测下一个 token</text>
<text x="27" y="222" class="t-s">因果掩码：第 i 行只能看第 1…i 列（蓝色），其余遮住</text>
<text class="t-s" text-anchor="middle"><tspan x="55" y="246">今</tspan><tspan x="77" y="246">天</tspan><tspan x="99" y="246">天</tspan><tspan x="121" y="246">气</tspan><tspan x="143" y="246">很</tspan><tspan x="165" y="246">好</tspan></text>
<text text-anchor="middle"><tspan x="30" y="268">今</tspan><tspan x="30" y="290">天</tspan><tspan x="30" y="312">天</tspan><tspan x="30" y="334">气</tspan><tspan x="30" y="356">很</tspan><tspan x="30" y="378">好</tspan></text>
<rect class="ln2 dash" x="44" y="252" width="132" height="132"/>
<path class="hi2" d="M44 252L66 252L66 274L88 274L88 296L110 296L110 318L132 318L132 340L154 340L154 362L176 362L176 384L44 384Z"/>
<text x="148" y="282" text-anchor="middle" class="t-s t-mu">遮住</text>
<text x="186" y="246" class="t-s">预测</text>
<text><tspan x="186" y="268">→ </tspan><tspan class="t-b">天</tspan><tspan x="186" y="290">→ </tspan><tspan class="t-b">天</tspan><tspan x="186" y="312">→ </tspan><tspan class="t-b">气</tspan><tspan x="186" y="334">→ </tspan><tspan class="t-b">很</tspan><tspan x="186" y="356">→ </tspan><tspan class="t-b">好</tspan><tspan x="186" y="378">→ </tspan><tspan class="t-b">。</tspan></text>
<text x="246" y="290" class="t-s">第 i 行用前 i 个字</text>
<text x="246" y="308" class="t-s">预测第 i+1 个字</text>
<text x="246" y="334" class="t-s">6 个位置的损失</text>
<text x="246" y="352" class="t-s">一起算，只跑 1 次</text>
<text x="246" y="370" class="t-s t-mu">（生成时要逐个跑）</text>
</svg>
