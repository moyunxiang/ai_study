<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 458" role="img" aria-labelledby="ppo-clip-title">
<title id="ppo-clip-title">PPO的裁剪目标：概率比走出区间就不再有好处</title>
<defs><marker id="ppo-clip-ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="f-ink"/></marker></defs>
<text x="12" y="18" class="t-s">概率比 r = π_new(a|s) ÷ π_old(a|s)；优势 A：动作比平均好多少</text>
<text x="210" y="40" text-anchor="middle" class="t-m">L = min( r·A , clip(r, 1−ε, 1+ε)·A )</text>
<text x="12" y="60" class="t-s">下面取 ε = 0.2，画一个动作的那一项 L 随 r 怎样变</text>
<text x="12" y="84" class="t-s"><tspan class="t-b t-a">①</tspan> A &gt; 0（好动作）：更新想让 r 变大</text>
<g class="ln2 dash">
<path d="M170 200V94"/><path d="M230 200V94"/>
</g>
<g class="ln" marker-end="url(#ppo-clip-ah)">
<path d="M50 200V92"/><path d="M50 200H388"/>
</g>
<text x="44" y="102" text-anchor="end" class="t-m">L</text>
<text x="392" y="204" class="t-m">r</text>
<path class="ln2 dash" d="M50 200L350 90"/>
<text x="356" y="96" class="t-m t-mu">r·A</text>
<path class="ln" d="M50 200L230 134"/>
<path class="ln-a" d="M230 134H380"/>
<circle class="f-a" cx="200" cy="145" r="4"/>
<text x="58" y="126" class="t-s">变差方向：照常计入</text>
<text x="238" y="156" class="t-s t-a">超过 1+ε：不再有收益</text>
<text x="238" y="172" class="t-s t-a">梯度为 0</text>
<text class="t-m" text-anchor="middle" x="50" y="216">0</text><text class="t-m" text-anchor="middle" x="170" y="216">1−ε</text><text class="t-m" text-anchor="middle" x="200" y="216">1</text><text class="t-m" text-anchor="middle" x="230" y="216">1+ε</text><text class="t-m" text-anchor="middle" x="350" y="216">2</text>
<text x="12" y="242" class="t-s"><tspan class="t-b t-a">②</tspan> A &lt; 0（坏动作）：更新想让 r 变小</text>
<text class="t-m" text-anchor="middle" x="170" y="262">1−ε</text><text class="t-m" text-anchor="middle" x="200" y="262">1</text><text class="t-m" text-anchor="middle" x="230" y="262">1+ε</text><text class="t-m" text-anchor="middle" x="350" y="262">2</text>
<g class="ln2 dash">
<path d="M170 270V384"/><path d="M230 270V384"/>
</g>
<path class="ln" d="M50 384V270"/>
<path class="ln" d="M50 270H388" marker-end="url(#ppo-clip-ah)"/>
<text x="44" y="384" text-anchor="end" class="t-m">L</text>
<text x="392" y="274" class="t-m">r</text>
<path class="ln2 dash" d="M50 270L350 380"/>
<path class="ln-a" d="M50 314H170"/>
<path class="ln" d="M170 314L350 380"/>
<circle class="f-a" cx="200" cy="325" r="4"/>
<text x="56" y="334" class="t-s t-a">低于 1−ε：</text>
<text x="56" y="350" class="t-s t-a">不再有收益</text>
<text x="56" y="366" class="t-s t-a">梯度为 0</text>
<text x="244" y="330" class="t-s">变差方向：照常计入</text>
<path class="ln2 dash" d="M14 400H34"/><text x="40" y="404" class="t-s">不裁剪的 r·A</text>
<path class="ln" d="M136 400H156"/><text x="162" y="404" class="t-s">PPO 目标 L</text>
<circle class="f-a" cx="246" cy="400" r="4"/><text x="256" y="404" class="t-s">起点 r = 1</text>
<text x="12" y="428" class="t-s"><tspan class="t-b t-a">③</tspan> 取 min：往有利方向走出 [1−ε, 1+ε] 后目标变平、不再推动；</text>
<text x="27" y="446" class="t-s">往变差方向走则照常计入。所以一步更新不会离旧策略太远</text>
</svg>
