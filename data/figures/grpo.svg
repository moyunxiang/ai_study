<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 398" role="img" aria-labelledby="grpo-title">
<title id="grpo-title">GRPO：同一道题的一组回答互相比较，代替价值网络</title>
<defs><marker id="grpo-ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="f-ink"/></marker></defs>
<text x="12" y="31" class="t-s">一道数学题</text>
<rect class="box" x="160" y="12" width="210" height="28" rx="6"/>
<text x="265" y="31" text-anchor="middle">问题 q：解 <tspan class="t-m">x²−5x+6=0</tspan></text>
<path class="ln" d="M265 40V52M160 52H370"/>
<text x="12" y="80" class="t-s"><tspan class="t-b t-a">①</tspan> 采样 G 个回答</text>
<text x="27" y="96" class="t-s t-mu">（示意 G = 4）</text>
<g class="box">
<rect x="130" y="68" width="60" height="26" rx="5"/><rect x="200" y="68" width="60" height="26" rx="5"/><rect x="270" y="68" width="60" height="26" rx="5"/><rect x="340" y="68" width="60" height="26" rx="5"/>
</g>
<text class="t-m" text-anchor="middle" x="160" y="86">x=2,3</text><text class="t-m" text-anchor="middle" x="230" y="86">x=1,6</text><text class="t-m" text-anchor="middle" x="300" y="86">x=5</text><text class="t-m" text-anchor="middle" x="370" y="86">x=3,2</text>
<text x="12" y="127" class="t-s"><tspan class="t-b t-a">②</tspan> 规则打分</text>
<rect class="hi3" x="134" y="112" width="52" height="22" rx="5"/><rect class="box" x="204" y="112" width="52" height="22" rx="5"/><rect class="box" x="274" y="112" width="52" height="22" rx="5"/><rect class="hi3" x="344" y="112" width="52" height="22" rx="5"/>
<text class="t-m" text-anchor="middle" x="160" y="127">r=1</text><text class="t-m" text-anchor="middle" x="230" y="127">r=0</text><text class="t-m" text-anchor="middle" x="300" y="127">r=0</text><text class="t-m" text-anchor="middle" x="370" y="127">r=1</text>
<text x="12" y="180" class="t-s"><tspan class="t-b t-a">③</tspan> 组内归一化</text>
<rect class="hi2" x="130" y="152" width="270" height="46" rx="7"/>
<text x="265" y="171" text-anchor="middle">组内 mean = 0.5，std = 0.5</text>
<text x="265" y="189" text-anchor="middle" class="t-m">A_i = (r_i − mean) / std</text>
<text x="27" y="231" class="t-s t-mu">得到优势 A</text>
<rect class="hi3" x="134" y="216" width="52" height="22" rx="5"/><rect class="hi" x="204" y="216" width="52" height="22" rx="5"/><rect class="hi" x="274" y="216" width="52" height="22" rx="5"/><rect class="hi3" x="344" y="216" width="52" height="22" rx="5"/>
<text class="t-m" text-anchor="middle" x="160" y="231">A=+1</text><text class="t-m" text-anchor="middle" x="230" y="231">A=−1</text><text class="t-m" text-anchor="middle" x="300" y="231">A=−1</text><text class="t-m" text-anchor="middle" x="370" y="231">A=+1</text>
<path class="ln" d="M160 238V248M230 238V248M300 238V248M370 238V248M160 248H370"/>
<text x="12" y="298" class="t-s"><tspan class="t-b t-a">④</tspan> 更新策略</text>
<rect class="box" x="130" y="264" width="270" height="60" rx="7"/>
<text x="265" y="283" text-anchor="middle">A&gt;0 的回答：每个 token 概率调高</text>
<text x="265" y="301" text-anchor="middle">A&lt;0 的回答：每个 token 概率调低</text>
<text x="265" y="317" text-anchor="middle" class="t-s">裁剪目标同 PPO，另加 KL(π_θ‖π_ref) 惩罚</text>
<g class="ln" marker-end="url(#grpo-ah)">
<path d="M160 52V66"/><path d="M230 52V66"/><path d="M300 52V66"/><path d="M370 52V66"/>
<path d="M160 94V110"/><path d="M230 94V110"/><path d="M300 94V110"/><path d="M370 94V110"/>
<path d="M160 134V150"/><path d="M230 134V150"/><path d="M300 134V150"/><path d="M370 134V150"/>
<path d="M160 198V214"/><path d="M230 198V214"/><path d="M300 198V214"/><path d="M370 198V214"/>
<path d="M265 248V262"/>
</g>
<rect class="box2" x="12" y="338" width="396" height="48" rx="7"/>
<text x="24" y="357" class="t-s"><tspan class="t-b">PPO</tspan>：另训一个和策略差不多大的价值网络，估计基线 V(s)</text>
<text x="24" y="375" class="t-s"><tspan class="t-b">GRPO</tspan>：用同组回答的平均分当基线，不需要价值网络</text>
</svg>
