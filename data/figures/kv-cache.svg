<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 488" role="img" aria-labelledby="kv-cache-title">
<title id="kv-cache-title">KV缓存：旧token的键和值只算一次</title>
<text x="12" y="17" class="t-s">已生成“今天天气很”，要预测下一个 token（只画一层）</text>
<rect class="hi" x="12" y="27" width="16" height="11" rx="2"/><text x="34" y="37" class="t-s">这一步要新算</text>
<rect class="f-mu" fill-opacity=".4" x="128" y="27" width="16" height="11" rx="2"/><text x="150" y="37" class="t-s">从缓存直接读</text>
<text x="12" y="60" class="t-s"><tspan class="t-b t-a">①</tspan> 不用缓存：每一步把整段 5 个位置全部重算</text>
<text x="80" y="82" text-anchor="middle">今</text><text x="150" y="82" text-anchor="middle">天</text><text x="220" y="82" text-anchor="middle">天</text><text x="290" y="82" text-anchor="middle">气</text><text x="360" y="82" text-anchor="middle" class="t-b">很</text>
<text x="26" y="104" text-anchor="middle" class="t-m">Q</text><text x="26" y="126" text-anchor="middle" class="t-m">K</text><text x="26" y="148" text-anchor="middle" class="t-m">V</text>
<g class="hi">
<rect x="52" y="90" width="56" height="18" rx="3"/><rect x="122" y="90" width="56" height="18" rx="3"/><rect x="192" y="90" width="56" height="18" rx="3"/><rect x="262" y="90" width="56" height="18" rx="3"/><rect x="332" y="90" width="56" height="18" rx="3"/>
<rect x="52" y="112" width="56" height="18" rx="3"/><rect x="122" y="112" width="56" height="18" rx="3"/><rect x="192" y="112" width="56" height="18" rx="3"/><rect x="262" y="112" width="56" height="18" rx="3"/><rect x="332" y="112" width="56" height="18" rx="3"/>
<rect x="52" y="134" width="56" height="18" rx="3"/><rect x="122" y="134" width="56" height="18" rx="3"/><rect x="192" y="134" width="56" height="18" rx="3"/><rect x="262" y="134" width="56" height="18" rx="3"/><rect x="332" y="134" width="56" height="18" rx="3"/>
</g>
<text x="12" y="172" class="t-s">前 4 列和上一步算出的完全一样，却又重算了一遍</text>
<text x="12" y="200" class="t-s"><tspan class="t-b t-a">②</tspan> 用缓存：只算新 token 的 q、k、v</text>
<text x="80" y="222" text-anchor="middle">今</text><text x="150" y="222" text-anchor="middle">天</text><text x="220" y="222" text-anchor="middle">天</text><text x="290" y="222" text-anchor="middle">气</text><text x="360" y="222" text-anchor="middle" class="t-b">很</text>
<text x="26" y="244" text-anchor="middle" class="t-m">Q</text><text x="26" y="270" text-anchor="middle" class="t-m">K</text><text x="26" y="292" text-anchor="middle" class="t-m">V</text>
<text x="185" y="243" text-anchor="middle" class="t-s t-mu">旧位置的 Q 之后用不到，不存</text>
<path class="ln2 dash" d="M46 252H324V300H46Z"/>
<g class="f-mu" fill-opacity=".4">
<rect x="52" y="256" width="56" height="18" rx="3"/><rect x="122" y="256" width="56" height="18" rx="3"/><rect x="192" y="256" width="56" height="18" rx="3"/><rect x="262" y="256" width="56" height="18" rx="3"/>
<rect x="52" y="278" width="56" height="18" rx="3"/><rect x="122" y="278" width="56" height="18" rx="3"/><rect x="192" y="278" width="56" height="18" rx="3"/><rect x="262" y="278" width="56" height="18" rx="3"/>
</g>
<g class="hi">
<rect x="332" y="230" width="56" height="18" rx="3"/><rect x="332" y="256" width="56" height="18" rx="3"/><rect x="332" y="278" width="56" height="18" rx="3"/>
</g>
<text x="185" y="316" text-anchor="middle" class="t-s">KV缓存：前几步已经存好</text>
<text x="360" y="316" text-anchor="middle" class="t-s">算完追加进去</text>
<text x="12" y="338" class="t-s">新 q 和全部 5 个 K 做内积、softmax，再对 5 个 V 加权求和</text>
<text x="12" y="364" class="t-s"><tspan class="t-b t-a">③</tspan> 用显存换计算（t 为当前长度）</text>
<text x="220" y="384" text-anchor="middle" class="t-s t-b">无缓存</text><text x="330" y="384" text-anchor="middle" class="t-s t-b">有缓存</text>
<path class="ln2" d="M24 391H396"/>
<text x="24" y="406" class="t-s">投影、前馈要算的位置</text><text x="220" y="406" text-anchor="middle" class="t-s">t 个</text><text x="330" y="406" text-anchor="middle" class="t-s t-a">1 个</text>
<text x="24" y="424" class="t-s">注意力里的查询</text><text x="220" y="424" text-anchor="middle" class="t-s">t 个</text><text x="330" y="424" text-anchor="middle" class="t-s t-a">1 个，读全部 t 个 K、V</text>
<text x="24" y="442" class="t-s">KV 缓存占的显存</text><text x="220" y="442" text-anchor="middle" class="t-s">无</text><text x="330" y="442" text-anchor="middle" class="t-s">随长度 t 线性增长</text>
<text x="12" y="464" class="t-s">例：Llama 2 7B 用 FP16，每个 token 要缓存约 0.5MB，</text>
<text x="27" y="480" class="t-s">一条 4096 个 token 的序列约 2GB</text>
</svg>
