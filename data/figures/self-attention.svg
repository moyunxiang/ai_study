<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 342" role="img" aria-labelledby="self-attention-title">
<title id="self-attention-title">自注意力：一个词怎样从整句里取信息</title>
<defs><marker id="self-attention-ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="f-ink"/></marker></defs>
<text x="12" y="17" class="t-s">句子里每个词都有三个向量：查询 Q、键 K、值 V</text>
<g>
<rect class="box" x="22" y="28" width="64" height="30" rx="6"/><text x="54" y="48" text-anchor="middle">猫</text>
<rect class="box" x="100" y="28" width="64" height="30" rx="6"/><text x="132" y="48" text-anchor="middle">吃</text>
<rect class="box" x="178" y="28" width="64" height="30" rx="6"/><text x="210" y="48" text-anchor="middle">鱼</text>
<rect class="hi" x="256" y="28" width="64" height="30" rx="6"/><text x="288" y="48" text-anchor="middle" class="t-b">它</text>
<rect class="box" x="334" y="28" width="64" height="30" rx="6"/><text x="366" y="48" text-anchor="middle">饱了</text>
</g>
<text x="12" y="78" class="t-s"><tspan class="t-b t-a">①</tspan> 拿“它”的 Q 和每个词的 K 做内积，</text>
<text x="27" y="94" class="t-s">除以 √d，再过 softmax，得到权重</text>
<g class="ln-a">
<path d="M288 58V108"/><path d="M54 118V108H366V118"/><path d="M132 108V118"/><path d="M210 108V118"/><path d="M288 108V118"/>
</g>
<path class="ln2" d="M22 178H398"/>
<g class="f-a">
<rect x="40" y="128" width="28" height="50" rx="2"/><rect x="118" y="174" width="28" height="4" rx="1"/><rect x="196" y="160" width="28" height="18" rx="2"/><rect x="274" y="171" width="28" height="7" rx="1"/><rect x="352" y="174" width="28" height="4" rx="1"/>
</g>
<g class="t-m" text-anchor="middle">
<text x="54" y="194">0.62</text><text x="132" y="194">0.04</text><text x="210" y="194">0.22</text><text x="288" y="194">0.08</text><text x="366" y="194">0.04</text>
</g>
<text x="12" y="218" class="t-s"><tspan class="t-b t-a">②</tspan> 按权重把每个词的 V 加起来（权重之和为 1）</text>
<g>
<rect class="f-a" x="32" y="228" width="44" height="24" rx="5" fill-opacity=".85"/><rect class="f-a" x="110" y="228" width="44" height="24" rx="5" fill-opacity=".1"/><rect class="f-a" x="188" y="228" width="44" height="24" rx="5" fill-opacity=".38"/><rect class="f-a" x="266" y="228" width="44" height="24" rx="5" fill-opacity=".18"/><rect class="f-a" x="344" y="228" width="44" height="24" rx="5" fill-opacity=".1"/>
</g>
<g text-anchor="middle" class="t-m">
<text x="54" y="245" class="f-p t-b">V</text><text x="132" y="245">V</text><text x="210" y="245">V</text><text x="288" y="245">V</text><text x="366" y="245">V</text>
</g>
<g marker-end="url(#self-attention-ah)">
<path class="ln" d="M54 252C54 274 180 268 196 290"/><path class="ln2" d="M132 252C132 270 196 272 203 290"/><path class="ln" d="M210 252L210 290"/><path class="ln2" d="M288 252C288 270 224 272 217 290"/><path class="ln2" d="M366 252C366 274 240 268 224 290"/>
</g>
<rect class="hi" x="96" y="292" width="228" height="34" rx="7"/>
<text x="210" y="314" text-anchor="middle" class="t-b">“它”的新表示：主要来自“猫”</text>
</svg>
