<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" role="img" aria-labelledby="gradient-descent-title">
<title id="gradient-descent-title">梯度下降：沿斜坡往下走，步子大小由学习率决定</title>
<defs><marker id="gradient-descent-ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8z" class="f-a"/></marker></defs>
<text x="12" y="17" class="t-s"><tspan class="t-b t-a">①</tspan> 每一步：算出当前点的斜率（梯度），朝反方向走</text>
<text x="27" y="35" class="t-m">w ← w − η·f′(w)</text>
<text x="150" y="35" class="t-s">η 是学习率，决定一步走多远</text>
<text x="12" y="53" class="t-s">示意函数 f(w) = (w − 3)²，谷底在 w = 3，都从 w = 0 出发</text>
<rect class="box2" x="10" y="64" width="400" height="110" rx="6"/>
<text x="20" y="82" class="t-s"><tspan class="t-b t-a">②</tspan> η = 0.05 太小：5 步后 w ≈ 1.23，离谷底还远</text>
<path class="ln2" d="M30 164H390"/>
<path class="ln" d="M50.0 97.4Q210.0 230.6 370.0 97.4"/>
<g class="ln-a" marker-end="url(#gradient-descent-ah)"><path d="M62.8 107.6L72.2 114.5"/><path d="M77.9 118.6L85.6 123.7"/><path d="M91.5 127.4L97.6 131.1"/><path d="M103.7 134.6L108.5 137.2"/><path d="M114.7 140.3L118.3 142.1"/></g>
<g class="f-a"><circle cx="60.0" cy="105.5" r="2.6"/><circle cx="75.0" cy="116.6" r="2.6"/><circle cx="88.5" cy="125.6" r="2.6"/><circle cx="100.7" cy="132.9" r="2.6"/><circle cx="111.6" cy="138.8" r="2.6"/><circle cx="121.4" cy="143.6" r="2.6"/></g>
<text x="68" y="102" class="t-s">起点</text>
<path class="ln2 dash" d="M210 160V168"/>
<text x="226" y="155" class="t-s t-mu">谷底</text>
<rect class="box2" x="10" y="182" width="400" height="110" rx="6"/>
<text x="20" y="200" class="t-s"><tspan class="t-b t-a">③</tspan> η = 0.3 合适：3 步后 w ≈ 2.81，已到谷底附近</text>
<path class="ln2" d="M30 282H390"/>
<path class="ln" d="M50.0 215.4Q210.0 348.6 370.0 215.4"/>
<g class="ln-a" marker-end="url(#gradient-descent-ah)"><path d="M63.1 225.2L146.9 271.0"/><path d="M153.4 273.4L182.6 279.8"/><path d="M189.5 280.8L196.9 281.5"/></g>
<g class="f-a"><circle cx="60.0" cy="223.5" r="2.6"/><circle cx="150.0" cy="272.6" r="2.6"/><circle cx="186.0" cy="280.5" r="2.6"/><circle cx="200.4" cy="281.8" r="2.6"/></g>
<rect class="box2" x="10" y="300" width="400" height="110" rx="6"/>
<text x="20" y="318" class="t-s"><tspan class="t-b t-a">④</tspan> η = 0.95 太大：每步都越过谷底，左右来回震荡</text>
<path class="ln2" d="M30 400H390"/>
<path class="ln" d="M50.0 333.4Q210.0 466.6 370.0 333.4"/>
<g class="ln-a" marker-end="url(#gradient-descent-ah)"><path d="M63.5 341.6L341.5 352.5"/><path d="M341.5 352.7L92.0 361.5"/><path d="M92.0 361.7L315.9 368.8"/><path d="M315.9 369.0L115.1 374.7"/><path d="M115.1 374.9L295.1 379.5"/></g>
<g class="f-a"><circle cx="60.0" cy="341.5" r="2.6"/><circle cx="345.0" cy="352.6" r="2.6"/><circle cx="88.5" cy="361.6" r="2.6"/><circle cx="319.3" cy="368.9" r="2.6"/><circle cx="111.6" cy="374.8" r="2.6"/><circle cx="298.6" cy="379.6" r="2.6"/></g>
</svg>
