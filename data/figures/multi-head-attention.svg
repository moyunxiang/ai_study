<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 350" role="img" aria-labelledby="multi-head-attention-title">
<title id="multi-head-attention-title">多头注意力：同一个输入并行做h次注意力，再拼起来</title>
<defs><marker id="multi-head-attention-ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="f-ink"/></marker></defs>
<text x="12" y="17" class="t-s"><tspan class="t-b t-a">①</tspan> 同一个 X 并行送进 h = 8 个头，每个头用自己的投影矩阵</text>
<rect class="box" x="80" y="26" width="260" height="30" rx="6"/>
<text x="210" y="46" text-anchor="middle">输入 X：n 个 token，每个 <tspan class="t-m">512</tspan> 维</text>
<path class="ln" d="M210 56V68M70 68H352"/>
<g class="ln" marker-end="url(#multi-head-attention-ah)">
<path d="M70 68V84"/><path d="M192 68V84"/><path d="M352 68V84"/>
</g>
<g>
<rect class="box" x="14" y="86" width="112" height="38" rx="6"/>
<rect class="box" x="136" y="86" width="112" height="38" rx="6"/>
<rect class="box" x="296" y="86" width="112" height="38" rx="6"/>
</g>
<g text-anchor="middle">
<text x="70" y="102" class="t-m">Q₁ K₁ V₁</text>
<text x="192" y="102" class="t-m">Q₂ K₂ V₂</text>
<text x="352" y="102" class="t-m">Q₈ K₈ V₈</text>
<text x="70" y="118" class="t-s">头1自己的W</text>
<text x="192" y="118" class="t-s">头2自己的W</text>
<text x="352" y="118" class="t-s">头8自己的W</text>
<text x="272" y="110" class="t-b t-mu">…</text>
<text x="272" y="166" class="t-b t-mu">…</text>
</g>
<g class="ln" marker-end="url(#multi-head-attention-ah)">
<path d="M70 124V140"/><path d="M192 124V140"/><path d="M352 124V140"/>
</g>
<g>
<rect class="hi2" x="14" y="142" width="112" height="40" rx="6"/>
<rect class="hi2" x="136" y="142" width="112" height="40" rx="6"/>
<rect class="hi2" x="296" y="142" width="112" height="40" rx="6"/>
</g>
<g text-anchor="middle">
<text x="70" y="159" class="t-b">注意力</text>
<text x="192" y="159" class="t-b">注意力</text>
<text x="352" y="159" class="t-b">注意力</text>
<text x="70" y="175" class="t-s">输出 n×64</text>
<text x="192" y="175" class="t-s">输出 n×64</text>
<text x="352" y="175" class="t-s">输出 n×64</text>
<text x="70" y="198" class="t-s t-bl">例：看相邻的词</text>
<text x="192" y="198" class="t-s t-bl">例：看指代对象</text>
<text x="352" y="198" class="t-s t-bl">例：看句法依赖</text>
</g>
<text x="12" y="222" class="t-s"><tspan class="t-b t-a">②</tspan> 8 个头的输出按维度首尾拼接：8 × 64 = 512 维</text>
<g class="ln" marker-end="url(#multi-head-attention-ah)">
<path d="M70 230C70 242 39 240 39 250"/><path d="M192 230C192 244 88 238 88 250"/><path d="M352 230C352 242 383 240 383 250"/>
</g>
<rect class="box" x="14" y="252" width="394" height="24" rx="4"/>
<path class="ln2" d="M63.25 252V276M112.5 252V276M161.75 252V276M211 252V276M260.25 252V276M309.5 252V276M358.75 252V276"/>
<g text-anchor="middle">
<text x="38.6" y="268" class="t-m">1</text><text x="87.9" y="268" class="t-m">2</text><text x="137.1" y="268" class="t-m">3</text><text x="186.4" y="268" class="t-m">4</text><text x="235.6" y="268" class="t-m">5</text><text x="284.9" y="268" class="t-m">6</text><text x="334.1" y="268" class="t-m">7</text><text x="383.4" y="268" class="t-m">8</text>
</g>
<text x="12" y="296" class="t-s"><tspan class="t-b t-a">③</tspan> 再乘输出矩阵 W_O</text>
<path class="ln" d="M211 276V300" marker-end="url(#multi-head-attention-ah)"/>
<rect class="hi" x="60" y="302" width="302" height="34" rx="7"/>
<text x="211" y="324" text-anchor="middle" class="t-b">输出：n×512，与输入同形状</text>
</svg>
