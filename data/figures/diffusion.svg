<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 426" role="img" aria-labelledby="diffusion-title">
<title id="diffusion-title">扩散模型：前向加噪，反向学着去噪</title>
<defs><marker id="diffusion-ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="f-ink"/></marker><marker id="diffusion-aa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="f-a"/></marker></defs>
<text x="12" y="17" class="t-s"><tspan class="t-b t-a">①</tspan> 前向：每步按 β<tspan baseline-shift="sub">t</tspan> 混入一点高斯噪声（固定，不用学）</text>
<path class="ln" d="M30 27H392" marker-end="url(#diffusion-ah)"/>
<g>
<rect class="box" x="20" y="34" width="56" height="44" rx="6"/>
<rect class="box" x="100" y="34" width="56" height="44" rx="6"/>
<rect class="box" x="214" y="34" width="56" height="44" rx="6"/>
<rect class="box" x="344" y="34" width="56" height="44" rx="6"/>
</g>
<circle class="f-b" cx="48" cy="56" r="13"/>
<circle class="f-b" cx="128" cy="56" r="13" fill-opacity=".75"/>
<circle class="f-b" cx="242" cy="56" r="13" fill-opacity=".28"/>
<path class="f-ink" d="M114 57h2v2h-2zM121 59h2v2h-2zM133 39h2v2h-2zM104 67h2v2h-2zM115 45h2v2h-2zM151 54h2v2h-2zM143 54h2v2h-2zM134 42h2v2h-2zM133 68h2v2h-2zM128 64h2v2h-2z"/>
<path class="f-ink" d="M249 39h2v2h-2zM253 58h2v2h-2zM231 38h2v2h-2zM259 54h2v2h-2zM252 69h2v2h-2zM236 66h2v2h-2zM238 71h2v2h-2zM259 41h2v2h-2zM224 45h2v2h-2zM263 53h2v2h-2zM247 48h2v2h-2zM241 51h2v2h-2zM234 58h2v2h-2zM245 70h2v2h-2zM258 73h2v2h-2zM249 43h2v2h-2zM260 57h2v2h-2zM251 45h2v2h-2zM231 39h2v2h-2zM221 66h2v2h-2zM237 42h2v2h-2zM231 65h2v2h-2zM246 38h2v2h-2zM251 49h2v2h-2zM241 73h2v2h-2zM226 52h2v2h-2zM219 68h2v2h-2zM232 72h2v2h-2zM239 56h2v2h-2z"/>
<path class="f-ink" d="M378 58h2v2h-2zM374 59h2v2h-2zM392 55h2v2h-2zM368 63h2v2h-2zM358 48h2v2h-2zM373 37h2v2h-2zM367 58h2v2h-2zM348 59h2v2h-2zM377 39h2v2h-2zM380 50h2v2h-2zM381 64h2v2h-2zM348 39h2v2h-2zM379 72h2v2h-2zM359 53h2v2h-2zM375 49h2v2h-2zM364 48h2v2h-2zM365 58h2v2h-2zM384 38h2v2h-2zM374 63h2v2h-2zM362 45h2v2h-2zM386 46h2v2h-2zM356 53h2v2h-2zM381 41h2v2h-2zM387 53h2v2h-2zM388 43h2v2h-2zM363 60h2v2h-2zM358 41h2v2h-2zM372 44h2v2h-2zM386 67h2v2h-2zM356 47h2v2h-2zM386 60h2v2h-2zM353 48h2v2h-2zM364 52h2v2h-2zM391 43h2v2h-2zM347 71h2v2h-2zM389 73h2v2h-2zM368 71h2v2h-2zM392 45h2v2h-2zM383 67h2v2h-2zM379 56h2v2h-2zM361 49h2v2h-2zM358 39h2v2h-2zM390 62h2v2h-2zM391 69h2v2h-2zM348 64h2v2h-2zM355 48h2v2h-2zM367 71h2v2h-2zM359 68h2v2h-2zM370 65h2v2h-2zM373 66h2v2h-2zM355 66h2v2h-2zM387 37h2v2h-2zM349 47h2v2h-2zM360 56h2v2h-2zM350 42h2v2h-2zM353 39h2v2h-2zM394 68h2v2h-2zM351 55h2v2h-2z"/>
<g text-anchor="middle">
<text x="185" y="60" class="t-mu">…</text><text x="307" y="60" class="t-mu">…</text>
</g>
<g class="t-m" text-anchor="middle">
<text x="48" y="94">x₀</text><text x="128" y="94">x₁</text><text x="242" y="94">x<tspan baseline-shift="sub">t</tspan></text><text x="372" y="94">x<tspan baseline-shift="sub">T</tspan></text>
</g>
<text x="372" y="94" class="t-s" text-anchor="end" dx="-14">纯噪声</text>
<text x="48" y="94" class="t-s" dx="14">数据</text>
<path class="ln-a" d="M392 110H30" marker-end="url(#diffusion-aa)"/>
<text x="12" y="129" class="t-s"><tspan class="t-b t-a">②</tspan> 反向：学一个网络，每步去掉一点噪声（要训练）</text>
<text x="12" y="148" class="t-h"><tspan class="t-a">③</tspan> 训练一步（论文算法1）</text>
<rect class="box" x="20" y="156" width="116" height="28" rx="6"/><text x="78" y="175" text-anchor="middle">取一张真实图 x₀</text>
<rect class="box" x="152" y="156" width="116" height="28" rx="6"/><text x="210" y="175" text-anchor="middle">随机步数 t</text>
<rect class="box" x="284" y="156" width="116" height="28" rx="6"/><text x="342" y="175" text-anchor="middle">噪声 <tspan class="t-m">ε~N(0,I)</tspan></text>
<g class="ln" marker-end="url(#diffusion-ah)">
<path d="M78 184V206"/><path d="M210 184V206"/><path d="M320 184V206"/><path d="M110 238V254"/><path d="M196 271H218"/>
</g>
<rect class="box" x="20" y="208" width="336" height="30" rx="6"/>
<text x="188" y="228" text-anchor="middle">一步加噪 <tspan class="t-m">x<tspan baseline-shift="sub">t</tspan> = √ᾱ<tspan baseline-shift="sub">t</tspan>·x₀ + √(1−ᾱ<tspan baseline-shift="sub">t</tspan>)·ε</tspan></text>
<path class="ln-a dash" d="M388 184V254" marker-end="url(#diffusion-aa)"/>
<text x="381" y="250" class="t-s t-a" text-anchor="end">真实 ε</text>
<text x="118" y="250" class="t-s">x<tspan baseline-shift="sub">t</tspan> 和 t 一起输入</text>
<rect class="hi2" x="20" y="256" width="176" height="30" rx="6"/>
<text x="108" y="276" text-anchor="middle" class="t-b">网络 <tspan class="t-m">ε<tspan baseline-shift="sub">θ</tspan>(x<tspan baseline-shift="sub">t</tspan>, t)</tspan> 猜噪声</text>
<rect class="hi" x="220" y="256" width="180" height="30" rx="6"/>
<text x="310" y="276" text-anchor="middle" class="t-b">均方误差 <tspan class="t-m">‖ε − ε<tspan baseline-shift="sub">θ</tspan>‖²</tspan></text>
<text x="20" y="304" class="t-s">对 θ 做梯度下降，换一张图、一个 t 再来，直到收敛</text>
<text x="12" y="332" class="t-h"><tspan class="t-a">④</tspan> 生成（论文算法2）：从纯噪声走 T 步</text>
<rect class="box2" x="20" y="340" width="380" height="76" rx="6"/>
<text x="32" y="359"><tspan class="t-m">x<tspan baseline-shift="sub">T</tspan> ~ N(0, I)</tspan>，对 <tspan class="t-m">t = T, …, 1</tspan> 重复：</text>
<text x="32" y="382" class="t-m">x<tspan baseline-shift="sub">t−1</tspan> = (x<tspan baseline-shift="sub">t</tspan> − β<tspan baseline-shift="sub">t</tspan>/√(1−ᾱ<tspan baseline-shift="sub">t</tspan>)·ε<tspan baseline-shift="sub">θ</tspan>)/√α<tspan baseline-shift="sub">t</tspan> + σ<tspan baseline-shift="sub">t</tspan>z</text>
<text x="32" y="405" class="t-s">z ~ N(0, I)，最后一步 z = 0；σ<tspan baseline-shift="sub">t</tspan>² = β<tspan baseline-shift="sub">t</tspan>。走完得到 x₀</text>
</svg>
