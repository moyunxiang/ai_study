<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" role="img" aria-labelledby="world-model-title">
<title id="world-model-title">世界模型：在脑子里先推演，再动手</title>
<defs><marker id="world-model-ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="f-ink"/></marker><marker id="world-model-ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="f-b"/></marker></defs>
<text x="12" y="17" class="t-s"><tspan class="t-b t-a">①</tspan> 编码器把高维的观测（如画面）压成一个小的隐状态 z</text>
<rect class="box2" x="20" y="26" width="76" height="34" rx="6"/><text x="58" y="48" text-anchor="middle">真实环境</text>
<rect class="box" x="114" y="26" width="70" height="34" rx="6"/><text x="149" y="48" text-anchor="middle">观测 o<tspan baseline-shift="sub" class="t-s">t</tspan></text>
<rect class="box" x="202" y="26" width="80" height="34" rx="6"/><text x="242" y="48" text-anchor="middle">编码器</text>
<rect class="hi" x="300" y="26" width="100" height="34" rx="6"/><text x="350" y="48" text-anchor="middle" class="t-b">隐状态 z<tspan baseline-shift="sub">t</tspan></text>
<g class="ln" marker-end="url(#world-model-ah)">
<path d="M96 43H112"/><path d="M184 43H200"/><path d="M282 43H298"/>
</g>
<text x="12" y="86" class="t-s"><tspan class="t-b t-a">②</tspan> 世界模型：用真实数据学“隐状态 + 动作 → 下一步”</text>
<rect class="hi2" x="20" y="94" width="380" height="52" rx="7"/>
<text x="210" y="112" text-anchor="middle" class="t-b">(z<tspan baseline-shift="sub">t</tspan>, a<tspan baseline-shift="sub">t</tspan>) → 下一个隐状态 z<tspan baseline-shift="sub">t+1</tspan>、奖励 r<tspan baseline-shift="sub">t+1</tspan></text>
<text x="210" y="137" text-anchor="middle" class="t-s">训练数据：智能体在真实环境里收集的 (o, a, r, o′)</text>
<text x="12" y="168" class="t-s"><tspan class="t-b t-a">③</tspan> 想象：不碰真实环境，在模型里往前推演 3 步</text>
<rect class="hi" x="20" y="184" width="44" height="30" rx="6"/>
<rect class="hi2 dash" x="132" y="184" width="44" height="30" rx="6"/>
<rect class="hi2 dash" x="244" y="184" width="44" height="30" rx="6"/>
<rect class="hi2 dash" x="356" y="184" width="44" height="30" rx="6"/>
<g text-anchor="middle">
<text x="42" y="202" class="t-b">z<tspan baseline-shift="sub">t</tspan></text>
<text x="154" y="202">z<tspan baseline-shift="sub">t+1</tspan></text>
<text x="266" y="202">z<tspan baseline-shift="sub">t+2</tspan></text>
<text x="378" y="202">z<tspan baseline-shift="sub">t+3</tspan></text>
</g>
<g class="ln-b" marker-end="url(#world-model-ab)">
<path d="M64 199H130"/><path d="M176 199H242"/><path d="M288 199H354"/>
</g>
<g text-anchor="middle">
<text x="98" y="192" class="t-s">动作 a</text><text x="210" y="192" class="t-s">动作 a</text><text x="322" y="192" class="t-s">动作 a</text>
<text x="98" y="217" class="t-s t-g">r=0.2</text><text x="210" y="217" class="t-s t-g">r=0.5</text><text x="322" y="217" class="t-s t-g">r=0.1</text>
</g>
<text x="12" y="240" class="t-s">每一步：策略 π 看 z 选动作 a，世界模型给出下一个 z 和奖励 r</text>
<text x="12" y="266" class="t-s"><tspan class="t-b t-a">④</tspan> 把想象出的奖励加起来，评价这一串动作</text>
<rect class="hi3" x="20" y="274" width="380" height="30" rx="7"/>
<text x="210" y="294" text-anchor="middle">想象回报 <tspan class="t-m">0.2+0.5+0.1=0.8</tspan> → 挑动作或训练策略 π</text>
<text x="12" y="326" class="t-s"><tspan class="t-b t-a">⑤</tspan> 真实环境里只执行选好的动作，新数据再拿来改进模型</text>
<text x="12" y="348" class="t-s t-mu">模型有误差：推得越远越不准，策略还可能钻模型的漏洞</text>
</svg>
