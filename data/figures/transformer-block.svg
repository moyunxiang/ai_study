<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 408" role="img" aria-labelledby="transformer-block-title">
<title id="transformer-block-title">Transformer层：两个子层，各带残差和归一化</title>
<defs><marker id="transformer-block-ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="f-ink"/></marker><marker id="transformer-block-ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="f-a"/></marker></defs>
<rect class="box" x="30" y="10" width="120" height="30" rx="6"/>
<text x="90" y="30" text-anchor="middle">输入 x（n×d）</text>
<rect class="box2" x="14" y="52" width="394" height="120" rx="8"/>
<text x="104" y="70" class="t-s"><tspan class="t-b t-a">①</tspan> 自注意力子层</text>
<text x="398" y="70" text-anchor="end" class="t-m">x ← x + Attn(LN(x))</text>
<rect class="box2" x="14" y="184" width="394" height="120" rx="8"/>
<text x="104" y="202" class="t-s"><tspan class="t-b t-a">②</tspan> 前馈子层</text>
<text x="398" y="202" text-anchor="end" class="t-m">x ← x + FFN(LN(x))</text>
<g class="ln-a" marker-end="url(#transformer-block-ar)">
<path d="M90 40V139"/><path d="M90 157V267"/><path d="M90 285V318"/>
</g>
<g class="f-ink"><circle cx="90" cy="92" r="3"/><circle cx="90" cy="224" r="3"/></g>
<g class="ln" marker-end="url(#transformer-block-ah)">
<path d="M90 92H138"/><path d="M198 92H218"/><path d="M380 106V148H101"/>
<path d="M90 224H138"/><path d="M198 224H218"/><path d="M380 238V280H101"/>
</g>
<rect class="box" x="140" y="80" width="58" height="24" rx="5"/>
<text x="169" y="96" text-anchor="middle" class="t-m">LN</text>
<rect class="hi2" x="220" y="78" width="176" height="28" rx="6"/>
<text x="308" y="97" text-anchor="middle" class="t-b">多头自注意力</text>
<text x="300" y="126" text-anchor="middle" class="t-s">各位置之间交换信息</text>
<rect class="box" x="140" y="212" width="58" height="24" rx="5"/>
<text x="169" y="228" text-anchor="middle" class="t-m">LN</text>
<rect class="hi3" x="220" y="210" width="176" height="28" rx="6"/>
<text x="308" y="229" text-anchor="middle"><tspan class="t-b">前馈网络</tspan> <tspan class="t-m">d→4d→d</tspan></text>
<text x="300" y="258" text-anchor="middle" class="t-s">每个位置各自加工</text>
<g class="box"><circle cx="90" cy="148" r="9"/><circle cx="90" cy="276" r="9"/></g>
<path class="ln" d="M85 148H95M90 143V153M85 276H95M90 271V281"/>
<text x="24" y="124" class="t-s t-a"><tspan class="t-b">③</tspan> 原样</text>
<text x="24" y="256" class="t-s t-a">原样</text>
<rect class="box" x="14" y="320" width="230" height="30" rx="6"/>
<text x="129" y="340" text-anchor="middle">输出：仍是 n×d，可再堆一层</text>
<text x="12" y="372" class="t-s"><tspan class="t-b t-a">③</tspan> 红线是残差主干：x 只被加、不被改写，梯度能直通</text>
<text x="12" y="392" class="t-s">图为 pre-LN；原论文是 post-LN：x ← LN(x + 子层(x))</text>
</svg>
