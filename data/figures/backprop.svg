<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 372" role="img" aria-labelledby="backprop-title">
<title id="backprop-title">反向传播：先前向算损失，再把梯度一层层传回去</title>
<defs><marker id="backprop-ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="f-ink"/></marker><marker id="backprop-ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="f-a"/></marker></defs>
<text x="12" y="17" class="t-s"><tspan class="t-b t-bl">①</tspan> 前向（蓝）：自上而下算出每个中间值，并存下来</text>
<text x="12" y="35" class="t-s"><tspan class="t-b t-a">②</tspan> 反向（红）：从 L 往上传，每过一个节点乘它的局部导数</text>
<text x="12" y="53" class="t-s"><tspan class="t-b t-a">③</tspan> 权重的梯度 = 传到该节点的信号 × 这条边的输入</text>
<g>
<rect class="box" x="140" y="70" width="140" height="30" rx="6"/>
<rect class="box" x="140" y="128" width="140" height="30" rx="6"/>
<rect class="box" x="140" y="186" width="140" height="30" rx="6"/>
<rect class="box" x="140" y="244" width="140" height="30" rx="6"/>
<rect class="hi" x="140" y="302" width="140" height="30" rx="6"/>
</g>
<g text-anchor="middle">
<text x="210" y="90" class="t-m">x <tspan class="t-bl t-b">= 2</tspan></text>
<text x="210" y="148" class="t-m">z = w₁·x <tspan class="t-bl t-b">= 1</tspan></text>
<text x="210" y="206" class="t-m">h = ReLU(z) <tspan class="t-bl t-b">= 1</tspan></text>
<text x="210" y="264" class="t-m">y = w₂·h <tspan class="t-bl t-b">= 3</tspan></text>
<text x="210" y="322" class="t-m">L = ½(y−t)² <tspan class="t-bl t-b">= 2</tspan></text>
</g>
<g class="ln" marker-end="url(#backprop-ah)">
<path d="M210 100V126"/><path d="M210 158V184"/><path d="M210 216V242"/><path d="M210 274V300"/>
<path d="M118 143H138"/><path d="M118 259H138"/><path d="M118 317H138"/>
</g>
<g>
<rect class="box2" x="14" y="128" width="104" height="30" rx="6"/>
<rect class="box2" x="14" y="244" width="104" height="30" rx="6"/>
<rect class="box2" x="14" y="302" width="104" height="30" rx="6"/>
</g>
<g text-anchor="middle">
<text x="66" y="148" class="t-m">w₁ = 0.5</text>
<text x="66" y="264" class="t-m">w₂ = 3</text>
<text x="66" y="322" class="t-m">目标 t = 1</text>
<text x="66" y="175" class="t-m t-a t-b">∂L/∂w₁=6×2=12</text>
<text x="66" y="291" class="t-m t-a t-b">∂L/∂w₂=2×1=2</text>
</g>
<g>
<text x="294" y="148" class="t-m t-a">∂L/∂z = 6</text>
<text x="294" y="206" class="t-m t-a">∂L/∂h = 6</text>
<text x="294" y="264" class="t-m t-a">∂L/∂y = 2</text>
<text x="294" y="322" class="t-m t-a">∂L/∂L = 1</text>
</g>
<g class="ln-a" marker-end="url(#backprop-ar)">
<path d="M300 310V271"/><path d="M300 252V213"/><path d="M300 194V155"/>
</g>
<g>
<text x="310" y="294" class="t-m t-a">× (y−t) = 2</text>
<text x="310" y="236" class="t-m t-a">× w₂ = 3</text>
<text x="310" y="178" class="t-m t-a">× ReLU′ = 1</text>
</g>
<text x="12" y="358" class="t-s">算出的梯度交给优化器：w ← w − η·∂L/∂w（见梯度下降）</text>
</svg>
