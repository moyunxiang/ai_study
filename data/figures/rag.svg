<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 404" role="img" aria-labelledby="rag-title">
<title id="rag-title">检索增强生成：先查资料，再作答</title>
<defs><marker id="rag-ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="f-ink"/></marker><marker id="rag-aa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="f-a"/></marker></defs>
<text x="12" y="17" class="t-s">模型参数里没有、或已经过时的知识，放在外部文档库里</text>
<rect class="box" x="20" y="26" width="380" height="28" rx="6"/>
<text x="32" y="45"><tspan class="t-b t-a">①</tspan> 问：我们公司2025年的差旅报销标准是多少？</text>
<path class="ln" d="M85 54V70" marker-end="url(#rag-ah)"/>
<rect class="hi2" x="20" y="72" width="130" height="28" rx="6"/>
<text x="85" y="91" text-anchor="middle"><tspan class="t-b t-a">②</tspan> 编码成向量 <tspan class="t-m">q</tspan></text>
<text x="24" y="118" class="t-m">q=[0.6, 0.8, …]</text>
<path class="ln" d="M150 86H166" marker-end="url(#rag-ah)"/>
<text x="24" y="146" class="t-s"><tspan class="t-b t-a">③</tspan> q 和每段的向量</text>
<text x="24" y="163" class="t-s">算相似度（内积），</text>
<text x="24" y="180" class="t-s">取最高的 k 段</text>
<text x="24" y="197" class="t-s">（这里 k=3）</text>
<text x="24" y="222" class="t-s t-mu">分数是示意数值</text>
<rect class="box2" x="168" y="64" width="232" height="172" rx="6"/>
<text x="178" y="80" class="t-s">文档库：事先切段、编码成向量</text>
<g>
<rect class="hi" x="178" y="88" width="212" height="24" rx="4"/>
<rect class="hi" x="178" y="116" width="212" height="24" rx="4"/>
<rect class="box" x="178" y="144" width="212" height="24" rx="4"/>
<rect class="hi" x="178" y="172" width="212" height="24" rx="4"/>
<rect class="box" x="178" y="200" width="212" height="24" rx="4"/>
</g>
<g>
<text x="186" y="105">段1 差旅报销标准2025版</text>
<text x="186" y="133">段2 报销流程与票据</text>
<text x="186" y="161" class="t-mu">段3 年假与调休规定</text>
<text x="186" y="189">段4 出差住宿标准2025版</text>
<text x="186" y="217" class="t-mu">段5 办公用品申领</text>
</g>
<g class="t-m" text-anchor="end">
<text x="382" y="105" class="t-a">0.91</text><text x="382" y="133" class="t-a">0.84</text><text x="382" y="161">0.35</text><text x="382" y="189" class="t-a">0.80</text><text x="382" y="217">0.21</text>
</g>
<path class="ln-a" d="M284 236V256" marker-end="url(#rag-aa)"/>
<rect class="box" x="20" y="258" width="380" height="64" rx="6"/>
<text x="32" y="277" class="t-b"><tspan class="t-a">④</tspan> 把这几段和问题拼成一个提示</text>
<text x="32" y="296">参考资料：<tspan class="t-a">[段1] [段2] [段4]</tspan></text>
<text x="32" y="314">问题：我们公司2025年的差旅报销标准是多少？</text>
<path class="ln" d="M110 322V340" marker-end="url(#rag-ah)"/>
<rect class="hi2" x="20" y="342" width="180" height="28" rx="6"/>
<text x="110" y="361" text-anchor="middle"><tspan class="t-b t-a">⑤</tspan> 大模型读提示作答</text>
<path class="ln" d="M200 356H218" marker-end="url(#rag-ah)"/>
<rect class="hi3" x="220" y="342" width="180" height="28" rx="6"/>
<text x="310" y="361" text-anchor="middle">答：按段1的标准…</text>
<text x="12" y="392" class="t-s">知识变了，只要更新文档库，不用重新训练模型</text>
</svg>
