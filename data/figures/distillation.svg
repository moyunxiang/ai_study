<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 468" role="img" aria-labelledby="distillation-title">
<title id="distillation-title">知识蒸馏：学生学老师升温后的软概率</title>
<defs><marker id="distillation-ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="f-ink"/></marker></defs>
<text x="12" y="17" class="t-s">例：一张轿车图片，三个类别（logits 和概率都是示意数值）</text>
<rect class="hi2" x="50" y="28" width="320" height="28" rx="6"/>
<text x="210" y="47" text-anchor="middle"><tspan class="t-b">老师模型（大）</tspan>输出 logits <tspan class="t-m">z = (9, 4, −1)</tspan></text>
<text x="12" y="78" class="t-s"><tspan class="t-b t-a">①</tspan> 带温度的 softmax：T 越高，分布越平</text>
<text x="210" y="96" text-anchor="middle" class="t-m">q_i = exp(z_i/T) / Σ_j exp(z_j/T)</text>
<rect class="box2" x="12" y="106" width="192" height="120" rx="7"/>
<rect class="box2" x="216" y="106" width="192" height="120" rx="7"/>
<text x="108" y="122" text-anchor="middle" class="t-b">T = 1（普通 softmax）</text>
<text x="312" y="122" text-anchor="middle" class="t-b">T = 4（蒸馏时用）</text>
<path class="ln2" d="M22 196H194M226 196H398"/>
<rect class="f-mu" x="30" y="146" width="28" height="50" rx="2"/>
<rect class="f-a" x="94" y="195" width="28" height="1"/>
<rect class="f-a" x="158" y="195" width="28" height="1"/>
<rect class="f-mu" x="234" y="159" width="28" height="37" rx="2"/>
<rect class="f-a" x="298" y="185" width="28" height="11" rx="2"/>
<rect class="f-a" x="362" y="193" width="28" height="3" rx="1"/>
<text class="t-m" text-anchor="middle" x="44" y="141">0.993</text><text class="t-m" text-anchor="middle" x="108" y="190">0.0067</text><text class="t-m" text-anchor="middle" x="172" y="190">0.00005</text>
<text class="t-m" text-anchor="middle" x="248" y="154">0.73</text><text class="t-m" text-anchor="middle" x="312" y="180">0.21</text><text class="t-m" text-anchor="middle" x="376" y="188">0.06</text>
<text class="t-s" text-anchor="middle" x="44" y="214">轿车</text><text class="t-s" text-anchor="middle" x="108" y="214">卡车</text><text class="t-s" text-anchor="middle" x="172" y="214">胡萝卜</text>
<text class="t-s" text-anchor="middle" x="248" y="214">轿车</text><text class="t-s" text-anchor="middle" x="312" y="214">卡车</text><text class="t-s" text-anchor="middle" x="376" y="214">胡萝卜</text>
<text x="12" y="246" class="t-s">T=1：错的两类都接近 0，在交叉熵里几乎不起作用</text>
<text x="12" y="262" class="t-s">T=4：<tspan class="t-a">卡车明显高于胡萝卜</tspan>，这层相似关系正是要教的信息</text>
<text x="12" y="288" class="t-s"><tspan class="t-b t-a">②</tspan> 学生同时拟合两个目标，加权求和</text>
<rect class="box" x="12" y="298" width="192" height="44" rx="7"/>
<rect class="box" x="216" y="298" width="192" height="44" rx="7"/>
<text x="108" y="316" text-anchor="middle">软标签：老师，T = 4</text>
<text x="108" y="334" text-anchor="middle" class="t-m">(0.73, 0.21, 0.06)</text>
<text x="312" y="316" text-anchor="middle">真实标签：轿车</text>
<text x="312" y="334" text-anchor="middle" class="t-m">(1, 0, 0)</text>
<text class="t-s" text-anchor="middle" x="108" y="360">学生也用 T=4，算交叉熵</text>
<text class="t-s" text-anchor="middle" x="108" y="376">再乘 T²（梯度随 1/T² 变小）</text>
<text class="t-s" text-anchor="middle" x="312" y="360">学生用 T=1，算交叉熵</text>
<text class="t-s" text-anchor="middle" x="312" y="376">权重小得多</text>
<g class="ln" marker-end="url(#distillation-ah)">
<path d="M108 384L176 404"/><path d="M312 384L244 404"/>
</g>
<rect class="hi3" x="130" y="406" width="160" height="28" rx="6"/>
<text x="210" y="425" text-anchor="middle" class="t-b">学生模型（小）</text>
<text x="12" y="456" class="t-s"><tspan class="t-b t-a">③</tspan> 训练完后，学生用 T=1 正常推理</text>
</svg>
