<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 398" role="img" aria-labelledby="moe-title">
<title id="moe-title">混合专家：每个token只走少数几个专家</title>
<defs><marker id="moe-ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="f-ink"/></marker><marker id="moe-aa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="f-a"/></marker></defs>
<text x="12" y="17" class="t-s">一层里的前馈网络（FFN）换成 8 个专家，每个专家都是一个 FFN</text>
<rect class="box" x="120" y="26" width="180" height="28" rx="6"/>
<text x="210" y="45" text-anchor="middle">一个 token 的向量 <tspan class="t-m">x</tspan></text>
<path class="ln" d="M210 54V70" marker-end="url(#moe-ah)"/>
<rect class="hi2" x="90" y="72" width="240" height="28" rx="6"/>
<text x="210" y="91" text-anchor="middle"><tspan class="t-b t-a">①</tspan> 门控网络打分 <tspan class="t-m">s = x·W<tspan baseline-shift="sub">g</tspan></tspan></text>
<text x="12" y="122" class="t-s"><tspan class="t-b t-a">②</tspan> 每个专家得一个分数，只留最高的 k=2 个</text>
<g>
<rect class="hi" x="22" y="130" width="41" height="22" rx="4"/><rect class="hi" x="69" y="130" width="41" height="22" rx="4"/>
<rect class="box2" x="116" y="130" width="41" height="22" rx="4"/><rect class="box2" x="163" y="130" width="41" height="22" rx="4"/><rect class="box2" x="210" y="130" width="41" height="22" rx="4"/><rect class="box2" x="257" y="130" width="41" height="22" rx="4"/><rect class="box2" x="304" y="130" width="41" height="22" rx="4"/><rect class="box2" x="351" y="130" width="41" height="22" rx="4"/>
</g>
<g class="t-m" text-anchor="middle">
<text x="42.5" y="146" class="t-a t-b">2.0</text><text x="89.5" y="146" class="t-a t-b">1.0</text><text x="136.5" y="146" class="t-mu">0.5</text><text x="183.5" y="146" class="t-mu">0.3</text><text x="230.5" y="146" class="t-mu">−0.2</text><text x="277.5" y="146" class="t-mu">0.1</text><text x="324.5" y="146" class="t-mu">−1.0</text><text x="371.5" y="146" class="t-mu">0.0</text>
</g>
<g class="ln-a" marker-end="url(#moe-aa)">
<path d="M42.5 152V174"/><path d="M89.5 152V174"/>
</g>
<g>
<rect class="hi" x="22" y="176" width="41" height="32" rx="5"/><rect class="hi" x="69" y="176" width="41" height="32" rx="5"/>
<rect class="box2" x="116" y="176" width="41" height="32" rx="5"/><rect class="box2" x="163" y="176" width="41" height="32" rx="5"/><rect class="box2" x="210" y="176" width="41" height="32" rx="5"/><rect class="box2" x="257" y="176" width="41" height="32" rx="5"/><rect class="box2" x="304" y="176" width="41" height="32" rx="5"/><rect class="box2" x="351" y="176" width="41" height="32" rx="5"/>
</g>
<g text-anchor="middle">
<text x="42.5" y="197" class="t-b">E₁</text><text x="89.5" y="197" class="t-b">E₂</text><text x="136.5" y="197" class="t-mu">E₃</text><text x="183.5" y="197" class="t-mu">E₄</text><text x="230.5" y="197" class="t-mu">E₅</text><text x="277.5" y="197" class="t-mu">E₆</text><text x="324.5" y="197" class="t-mu">E₇</text><text x="371.5" y="197" class="t-mu">E₈</text>
</g>
<text x="254" y="228" class="t-s" text-anchor="middle">E₃–E₈：这个 token 完全不计算</text>
<g class="ln" marker-end="url(#moe-ah)">
<path d="M42.5 208V248"/><path d="M89.5 208V248"/>
</g>
<rect class="hi" x="20" y="250" width="380" height="30" rx="7"/>
<text x="210" y="270" text-anchor="middle"><tspan class="t-b t-a">③</tspan> 输出 <tspan class="t-m t-b">y = 0.73·E₁(x) + 0.27·E₂(x)</tspan></text>
<text x="20" y="298" class="t-s">权重 0.73、0.27：只对选中的 2.0、1.0 做 softmax</text>
<text x="12" y="326" class="t-s"><tspan class="t-b t-a">④</tspan> 参数要全部存着，计算只花在选中的专家上</text>
<text x="20" y="349" class="t-s">存着的参数</text>
<rect class="f-b" x="100" y="337" width="300" height="16" rx="3" fill-opacity=".35"/>
<path class="ln2" d="M137.5 337v16M175 337v16M212.5 337v16M250 337v16M287.5 337v16M325 337v16M362.5 337v16"/>
<text x="20" y="377" class="t-s">这次用到的</text>
<rect class="box2" x="100" y="365" width="300" height="16" rx="3"/>
<rect class="f-a" x="100" y="365" width="75" height="16" rx="3"/>
<text x="184" y="377" class="t-s">2/8，下一个 token 重新挑</text>
</svg>
